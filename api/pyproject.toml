[project]
name = "ai-support-assistant-api"
version = "0.1.0"
description = "AI assistant for customer-support teams: FastAPI backend, RAG over company guidelines."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "pgvector",
  "procrastinate[psycopg]",
  "google-genai",
  "pyjwt",
  "argon2-cffi",
  "structlog",
  "pypdf",
  "mammoth",
  "langfuse>=3",
  "httpx",
  "python-dotenv",
  "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "testcontainers[postgres]",
  "ruff",
  "mypy",
  "asgi-lifespan",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::jwt.exceptions.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "B008", "SIM108", "E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
ignore_missing_imports = true
