# HTTPS override for the production-like stack (certificates from scripts/tls/setup.sh):
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
services:
  nginx:
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_TLS_PORT:-443}:443'
    volumes:
      - ./nginx/templates-tls:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
